<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Discover Aura Watch, where timeless elegance meets uncompromising Swiss craftsmanship. Explore our exclusive analog masterpieces designed for those who command time.">

    <title>Aura Watch</title>

    <link rel="stylesheet" href="style.css">

</head>

    <header>

        </div>

        </div>
    </section>

    <section class="philosophy-section">
        <p>"Crafted not to tell time, but to immortalize its moments."</p>

    <section class="specs-section">
        <div class="spec-item">01 / Pure Mechanical</div>
        <div class="spec-item">02 / Sapphire Crystal</div>

        <div class="slider">
            <div class="slide-track">
                <!-- المجموعة الأولى -->

                <div class="slide-item"><img src="https://images.unsplash.com/photo-1526045431048-f857369baa09?w=500&auto=format&fit=crop&q=60" alt="Watch"></div>
                
                <!-- المجموعة الثانية (مطابقة للأولى تماماً للـ Loop الناعم) -->

            </div>

    <footer>
        <div class="footer-content">

            <div class="footer-links">
